name: Create Environment Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to create (e.g., staging, prod)'
        required: true
        default: 'staging'
  workflow_call:
    inputs:
      environment:
        description: 'Environment to create (e.g., staging, prod)'
        required: true
        type: string
        default: 'staging'

jobs:
  create-infra:
    runs-on: ubuntu-latest
    name: Create Infrastructure with Terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        # Authenticates with AWS using IAM user access keys stored in GitHub Secrets
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.14.3

      - name: Initialize Terraform
        run: terraform init
        working-directory: ./terraform

      - name: Switch to Environment Workspace
        run: |
          ENV=${{ github.event.inputs.environment || inputs.environment }}
          terraform workspace select $ENV || terraform workspace new $ENV
        working-directory: ./terraform

      - name: Apply Terraform Configuration
        run: terraform apply -auto-approve
        working-directory: ./terraform