name: Deploy Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to (e.g., staging, prod)'
        required: true
        default: 'staging'
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to (e.g., staging, prod)'
        required: true
        type: string
        default: 'staging'

jobs:
  build-and-push: # Builds docker images and pushes to AWS ECR with KMS? encryption
    runs-on: ubuntu-latest
    name: Build and Push Multi-Service Docker Images to ECR

    steps:
      # --- Setup ---
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Initialize Terraform
        run: terraform init
        working-directory: ./terraform

      - name: Select Environment Workspace
        env:
          ENV: ${{ github.event.inputs.environment || inputs.environment }}
        run: |
          if terraform workspace select $ENV; then
            echo "Using workspace $ENV"
          else
            echo "Workspace $ENV does not exist"
            exit 1
          fi
        working-directory: ./terraform

      # --- Get ECR URL and set Docker image tags for this job ---
      - name: Get Terraform outputs
        run: |
          set -e
          repo_url=$(terraform output -raw ecr_repository_url)
          echo "ECR_REPO=$repo_url" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=$repo_url:backend-${{ github.sha }}" >> "$GITHUB_ENV"
          echo "SCRAPER_IMAGE=$repo_url:scraper-${{ github.sha }}" >> "$GITHUB_ENV"
          echo "SSURGO_IMAGE=$repo_url:ssurgo-${{ github.sha }}" >> "$GITHUB_ENV"
        working-directory: ./terraform

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        # Enables advanced Docker build caching and multi-platform builds
        uses: docker/setup-buildx-action@v2

      - name: Build and push backend Node.js service to ECR
        uses: docker/build-push-action@v4
        with:
          context: ./backend/node_server
          file: ./backend/node_server/Dockerfile
          push: true
          platforms: linux/amd64 
          provenance: false  # Prevents empty images in ECR
          sbom: false
          tags: |
            ${{ env.ECR_REPO }}:backend-latest
            ${{ env.ECR_REPO }}:backend-${{ github.sha }}
          cache-from: type=gha,key=backend-${{ github.ref }}
          cache-to: type=gha,key=backend-${{ github.ref }},mode=max

      - name: Build and push scraping service to ECR
        uses: docker/build-push-action@v4
        with:
          context: ./backend/python-services/scraping-service
          file: ./backend/python-services/scraping-service/Dockerfile
          push: true
          platforms: linux/amd64 
          provenance: false
          sbom: false
          tags: |
            ${{ env.ECR_REPO }}:scraper-latest
            ${{ env.ECR_REPO }}:scraper-${{ github.sha }}
          cache-from: type=gha,key=scraper-${{ github.ref }}
          cache-to: type=gha,key=scraper-${{ github.ref }},mode=max

      - name: Build and push SSURGO service to ECR
        uses: docker/build-push-action@v4
        with:
          context: ./backend/python-services/ssurgo-service
          file: ./backend/python-services/ssurgo-service/Dockerfile
          push: true
          platforms: linux/amd64 
          provenance: false
          sbom: false
          tags: |
            ${{ env.ECR_REPO }}:ssurgo-latest
            ${{ env.ECR_REPO }}:ssurgo-${{ github.sha }}
          cache-from: type=gha,key=ssurgo-${{ github.ref }}
          cache-to: type=gha,key=ssurgo-${{ github.ref }},mode=max

  # ---- Deploy jobs run in parallel after build ----

  deploy-backend:
    runs-on: ubuntu-latest
    name: Deploy Backend to ECS
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Initialize Terraform
        run: terraform init
        working-directory: ./terraform

      - name: Select Environment Workspace
        env:
          ENV: ${{ github.event.inputs.environment || inputs.environment }}
        run: |
          if terraform workspace select $ENV; then
            echo "Using workspace $ENV"
          else
            echo "Workspace $ENV does not exist"
            exit 1
          fi
        working-directory: ./terraform

      - name: Get Terraform outputs
        run: |
          set -e
          repo_url=$(terraform output -raw ecr_repository_url)
          cluster=$(terraform output -raw ecs_cluster_name)
          backend_service=$(terraform output -raw ecs_service_name)
          echo "BACKEND_IMAGE=$repo_url:backend-${{ github.sha }}" >> "$GITHUB_ENV"
          echo "ECS_CLUSTER=$cluster" >> "$GITHUB_ENV"
          echo "ECS_BACKEND_SERVICE=$backend_service" >> "$GITHUB_ENV"
        working-directory: ./terraform

      - name: Download current backend task definition
        env:
          ENV: ${{ github.event.inputs.environment || inputs.environment }}
        run: |
          aws ecs describe-task-definition \
          --task-definition isa-crop-$ENV-backend \
          --query taskDefinition > backend-task-definition.json

      - name: Update backend task definition with new image
        id: task-def-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-definition.json
          container-name: backend
          image: ${{ env.BACKEND_IMAGE }}

      - name: Deploy updated backend task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-backend.outputs.task-definition }}
          service: ${{ env.ECS_BACKEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 30

  deploy-scraper:
    runs-on: ubuntu-latest
    name: Deploy Scraper to ECS
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Initialize Terraform
        run: terraform init
        working-directory: ./terraform

      - name: Select Environment Workspace
        env:
          ENV: ${{ github.event.inputs.environment || inputs.environment }}
        run: |
          if terraform workspace select $ENV; then
            echo "Using workspace $ENV"
          else
            echo "Workspace $ENV does not exist"
            exit 1
          fi
        working-directory: ./terraform

      - name: Get Terraform outputs
        run: |
          set -e
          repo_url=$(terraform output -raw ecr_repository_url)
          cluster=$(terraform output -raw ecs_cluster_name)
          scraper_service=$(terraform output -raw ecs_scraper_service_name)
          echo "SCRAPER_IMAGE=$repo_url:scraper-${{ github.sha }}" >> "$GITHUB_ENV"
          echo "ECS_CLUSTER=$cluster" >> "$GITHUB_ENV"
          echo "ECS_SCRAPER_SERVICE=$scraper_service" >> "$GITHUB_ENV"
        working-directory: ./terraform

      - name: Download current scraper task definition
        env:
          ENV: ${{ github.event.inputs.environment || inputs.environment }}
        run: |
          aws ecs describe-task-definition \
          --task-definition isa-crop-$ENV-scraper \
          --query taskDefinition > scraper-task-definition.json

      - name: Update scraper task definition with new image
        id: task-def-scraper
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: scraper-task-definition.json
          container-name: scraper
          image: ${{ env.SCRAPER_IMAGE }}

      - name: Deploy updated scraper task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-scraper.outputs.task-definition }}
          service: ${{ env.ECS_SCRAPER_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 30

  deploy-ssurgo:
    runs-on: ubuntu-latest
    name: Deploy SSURGO to ECS
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Initialize Terraform
        run: terraform init
        working-directory: ./terraform

      - name: Select Environment Workspace
        env:
          ENV: ${{ github.event.inputs.environment || inputs.environment }}
        run: |
          if terraform workspace select $ENV; then
            echo "Using workspace $ENV"
          else
            echo "Workspace $ENV does not exist"
            exit 1
          fi
        working-directory: ./terraform

      - name: Get Terraform outputs
        run: |
          set -e
          repo_url=$(terraform output -raw ecr_repository_url)
          cluster=$(terraform output -raw ecs_cluster_name)
          ssurgo_service=$(terraform output -raw ecs_ssurgo_service_name)
          echo "SSURGO_IMAGE=$repo_url:ssurgo-${{ github.sha }}" >> "$GITHUB_ENV"
          echo "ECS_CLUSTER=$cluster" >> "$GITHUB_ENV"
          echo "ECS_SSURGO_SERVICE=$ssurgo_service" >> "$GITHUB_ENV"
        working-directory: ./terraform

      - name: Download current SSURGO task definition
        env:
          ENV: ${{ github.event.inputs.environment || inputs.environment }}
        run: |
          aws ecs describe-task-definition \
          --task-definition isa-crop-$ENV-ssurgo \
          --query taskDefinition > ssurgo-task-definition.json

      - name: Update SSURGO task definition with new image
        id: task-def-ssurgo
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ssurgo-task-definition.json
          container-name: ssurgo
          image: ${{ env.SSURGO_IMAGE }}

      - name: Deploy updated SSURGO task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def-ssurgo.outputs.task-definition }}
          service: ${{ env.ECS_SSURGO_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 30

  deploy-frontend:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend to S3
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Initialize Terraform
        run: terraform init
        working-directory: ./terraform

      - name: Select Environment Workspace
        env:
          ENV: ${{ github.event.inputs.environment || inputs.environment }}
        run: |
          if terraform workspace select $ENV; then
            echo "Using workspace $ENV"
          else
            echo "Workspace $ENV does not exist"
            exit 1
          fi
        working-directory: ./terraform

      - name: Get Terraform outputs
        run: |
          set -e
          deploy_bucket=$(terraform output -raw frontend_bucket_name)
          recaptcha_key=$(terraform output -raw recaptcha_site_key)
          ga4_measurement_id=$(terraform output -raw ga4_measurement_id)
          api_url=$(terraform output -raw api_url)
          cloudfront_id=$(terraform output -raw frontend_cloudfront_id)
          echo "DEPLOY_BUCKET=$deploy_bucket" >> "$GITHUB_ENV"
          echo "RECAPTCHA_SITE_KEY=$recaptcha_key" >> "$GITHUB_ENV"
          echo "GA4_MEASUREMENT_ID=$ga4_measurement_id" >> "$GITHUB_ENV"
          echo "API_URL=$api_url" >> "$GITHUB_ENV"
          echo "CLOUDFRONT_ID=$cloudfront_id" >> "$GITHUB_ENV"
        working-directory: ./terraform

      # --- Frontend Build and S3 Sync ---
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install npm dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_RECAPTCHA_SITE_KEY: ${{ env.RECAPTCHA_SITE_KEY }}
          VITE_API_BASE_URL: ${{ env.API_URL }}
          VITE_GA4_MEASUREMENT_ID: ${{ env.GA4_MEASUREMENT_ID }}
          VITE_ANALYTICS_ENABLED: true
        run: npm run build

      # Sync all files except index.html with long-term caching
      - name: Sync dist folder to S3
        run: |
          echo "Syncing files to S3 bucket: $DEPLOY_BUCKET"
          aws s3 sync ./frontend/dist s3://$DEPLOY_BUCKET \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          
          if [ $? -ne 0 ]; then
            echo "Error: Failed to sync files to S3"
            exit 1
          fi

      # Always upload index.html with no-cache
      - name: Upload index.html separately
        run: |
          echo "Uploading index.html to S3 bucket: $DEPLOY_BUCKET"
          aws s3 cp ./frontend/dist/index.html s3://$DEPLOY_BUCKET/index.html \
            --cache-control "no-cache"
          
          if [ $? -ne 0 ]; then
            echo "Error: Failed to upload index.html to S3"
            exit 1
          fi

      # ---- CloudFront Invalidation ----
      - name: Invalidate CloudFront
        if: ${{ env.CLOUDFRONT_ID != '' }}
        run: |
          echo "Creating CloudFront invalidation for distribution: $CLOUDFRONT_ID"
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_ID \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          
          if [ $? -eq 0 ]; then
            echo "CloudFront invalidation created successfully: $invalidation_id"
          else
            echo "Warning: CloudFront invalidation failed, but deployment will continue"
          fi

      - name: Build notifications
        if: always()
        run: |
          echo "Build Summary:"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          if [ "${{ job.status }}" == "success" ]; then
            echo "Status: SUCCESS"
            echo "All images were built and pushed successfully"
            echo "Frontend files synced to S3 bucket: $DEPLOY_BUCKET"
          else
            echo "Status: FAILED"
            echo "View logs for error details"
          fi