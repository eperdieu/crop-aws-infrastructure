name: Apply Database Schema Migration

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to apply migrations to'
        required: true
        default: 'staging'
  workflow_call:
    inputs:
      environment:
        description: 'Environment to apply migrations to'
        required: true
        type: string
        default: 'staging'

jobs:
  apply-schema:
    runs-on: ubuntu-latest
    name: Apply Database Schema Migration

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run migrations
        run: |
          ENV=${{ github.event.inputs.environment || inputs.environment }}
          CLUSTER=$(aws ssm get-parameter --name "/isa/$ENV/ecs_cluster_name"    --query 'Parameter.Value' --output text)
          TASK_DEF=$(aws ssm get-parameter --name "/isa/$ENV/ecs_task_definition" --query 'Parameter.Value' --output text)
          SUBNET_1=$(aws ssm get-parameter --name "/isa/$ENV/private_subnet_1"    --query 'Parameter.Value' --output text)
          SUBNET_2=$(aws ssm get-parameter --name "/isa/$ENV/private_subnet_2"    --query 'Parameter.Value' --output text)
          SG=$(aws ssm get-parameter       --name "/isa/$ENV/node_server_sg_id"     --query 'Parameter.Value' --output text)

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNET_1,$SUBNET_2],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["node","dev_scripts/migrateSchema.js"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Task ARN: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          echo "Exit code: $EXIT_CODE"

          [ "$EXIT_CODE" = "0" ] || exit 1